name: Analyze Landing

on:
  repository_dispatch:
    types: [analyze-landing]

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Needed for repository_dispatch to work
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Capture screenshots
        id: capture
        run: |
          npx tsx src/scripts/capture-screenshots.ts ${{ github.event.client_payload.versionId }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VERSION_ID: ${{ github.event.client_payload.versionId }}

      - name: AI Analysis (Ollama)
        id: analyze
        run: |
          npx tsx src/scripts/ai-analysis.ts ${{ github.event.client_payload.versionId }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OLLAMA_URL: ${{ secrets.OLLAMA_URL }}
          OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL || 'qwen2-vl:7b' }}
          VERSION_ID: ${{ github.event.client_payload.versionId }}

      - name: Generate PDF
        id: pdf
        run: |
          npx tsx src/scripts/generate-pdf.ts ${{ github.event.client_payload.versionId }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VERSION_ID: ${{ github.event.client_payload.versionId }}

      - name: Notify completion (optional)
        if: always()
        run: |
          echo "Job completed for version ${{ github.event.client_payload.versionId }}"